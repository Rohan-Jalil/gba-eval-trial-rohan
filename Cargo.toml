[package]
name = "gba_emu"
version = "0.1.0"
edition = "2021"
description = "Original Game Boy Advance emulator, built as a wasm32 cdylib"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
# The emulator loop is far too slow unoptimised for running ROMs from tests or run_rom.
opt-level = 2
